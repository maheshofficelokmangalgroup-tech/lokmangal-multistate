# Render Blueprint: static hosting of the public website, built from frontend/seed/snapshot.json, for reviewing the
# design. There is no API here, so forms show an "email us / call us" message and there is no admin panel.
# The full system (admin panel, Rust API, releases) runs with Docker: see deploy/ and README.md.
# In Render: New + → Blueprint → choose this GitHub repo → Apply.
services:
  - type: web
    name: lokmangal-multistate
    runtime: static
    buildCommand: npm ci && npm run build:site:seed
    staticPublishPath: ./frontend/dist
    envVars:
      - key: NODE_VERSION
        value: 24.11.1
    headers:
      - path: /_astro/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    # Legacy WordPress URLs, answered with real HTTP 301 redirects (same list as the seed snapshot).
    routes:
      - type: redirect
        source: /top-banks-in-pune
        destination: /about-us/
      - type: redirect
        source: /home-loan-in-solapur
        destination: /social-responsibility/
      - type: redirect
        source: /investment-schemes-in-osmanabad
        destination: /deposits/
      - type: redirect
        source: /deposit
        destination: /deposits/
      - type: redirect
        source: /landing
        destination: /deposits/
      - type: redirect
        source: /interest-rates-on-fixed-deposits
        destination: /interest-rates/
      - type: redirect
        source: /agriculture-loan-in-solapur
        destination: /loans/
      - type: redirect
        source: /salary-account-in-pune
        destination: /other-services/
      - type: redirect
        source: /bank-in-solapur
        destination: /faq/
      - type: redirect
        source: /bank-in-belgaon
        destination: /branches/
      - type: redirect
        source: /top-banks-in-pimpri-chinchwad
        destination: /branches/
      - type: redirect
        source: /marathi
        destination: /branches/
      - type: redirect
        source: /cooperative-banks-in-osmanabad
        destination: /contact-us/
      - type: redirect
        source: /fd-plans-in-pune
        destination: /blog/
      - type: redirect
        source: /category/blog
        destination: /blog/
      - type: redirect
        source: /fixed-deposit-interest-rates-in-solapur
        destination: /careers/
