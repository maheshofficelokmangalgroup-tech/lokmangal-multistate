name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # Unit tests plus the API integration tests (they create their own databases).
      - run: cargo test -- --include-ignored
      - run: cargo install cargo-audit --locked && cargo audit

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Shared finance rules (fixtures from the published leaflets)
        run: npm run test:finance
      - name: Admin type-check, unit tests and production build
        run: |
          npm run typecheck -w @lokmangal/admin
          npm test -w @lokmangal/admin
          npm run build -w @lokmangal/admin
      - name: Public website builds from the seed snapshot
        run: |
          PAGE_TEXT_CATALOG="$PWD/admin/src/generated/page-text.json" npm run build:site:seed
          test "$(find frontend/dist -name '*.html' | wc -l)" -ge 100
          git diff --exit-code admin/src/generated/page-text.json
          ! grep -rE '\{(rate|rate2|number|calc)(:[^}]*)?\}' frontend/dist --include=*.html
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, web]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start the stack (API + worker + builder) and publish end to end
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          cp .env.example .env
          sed -i '/^SMTP_/d' .env
          cargo build --bins
          ./target/debug/lokmangal-cli migrate
          ./target/debug/lokmangal-cli import-seed ../frontend/seed/snapshot.json
          ./target/debug/lokmangal-cli create-admin --email ci@example.com --name "CI Admin" | tail -1 > ../invite.txt
          (node ../frontend/builder/server.mjs > ../builder.log 2>&1 &)
          (./target/debug/lokmangal-server > ../server.log 2>&1 &)
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/v1/health && break || sleep 2; done
          node ../tests/e2e/publish-smoke.mjs "$(cat ../invite.txt)"
      - if: failure()
        run: tail -n 80 builder.log server.log

  # The all-in-one Render image, run in production mode: sign in, publish, send a form, open a preview, restart.
  render-image:
    runs-on: ubuntu-latest
    needs: [backend, web]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/render/Dockerfile
          load: true
          tags: lokmangal-render
          cache-from: type=gha,scope=render
          cache-to: type=gha,mode=max,scope=render
      - name: Start the container
        run: |
          echo "127.0.0.1 admin.test site.test preview.test" | sudo tee -a /etc/hosts
          docker run -d --name app -p 80:10000 --add-host=host.docker.internal:host-gateway \
            -e PORT=10000 \
            -e DATABASE_URL=postgres://postgres:postgres@host.docker.internal:5432/postgres \
            -e RENDER_EXTERNAL_HOSTNAME=admin.test -e PUBLIC_HOST=site.test -e PREVIEW_HOST=preview.test \
            -e SESSION_KEY="$(openssl rand -base64 32)" -e DATA_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
            -e DATA_ENCRYPTION_KEY_VERSION=1 -e BUILD_SERVICE_TOKEN="$(openssl rand -hex 32)" -e JOB_CONCURRENCY=1 \
            lokmangal-render
          for i in $(seq 1 60); do curl -fsS http://admin.test/api/v1/health && break || sleep 2; done
      - name: Hosts stay apart
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://site.test/api/admin/auth/me)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://admin.test/api/v1/enquiries)" = 404
          curl -fsS http://admin.test/ | grep -q 'id="root"'
          curl -fsS http://localhost/api/v1/health
      - name: Publish end to end
        env:
          API: http://admin.test
          SITE: http://site.test
          PREVIEW: http://preview.test
          ORIGIN: https://admin.test
        run: node tests/e2e/publish-smoke.mjs "$(docker exec app first-admin ci@example.com 'CI Admin' | tail -1)"
      - name: The live release survives a restart
        run: |
          id="$(curl -fsS http://site.test/release.json)"
          docker restart app
          for i in $(seq 1 60); do curl -fsS http://admin.test/api/v1/health && break || sleep 2; done
          test "$(curl -fsS http://site.test/release.json)" = "$id"
      - if: failure()
        run: docker logs --tail 120 app

  # Image builds are checked on every push; publishing images to GHCR happens in release.yml.
  images:
    runs-on: ubuntu-latest
    needs: [backend, web]
    strategy:
      matrix:
        include:
          - { name: api, file: backend/Dockerfile }
          - { name: site-builder, file: frontend/Dockerfile }
          - { name: admin, file: admin/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
